{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 text-center py-4">
            <div class="empty-state border-0 shadow-sm p-5">
                <div class="stat-icon primary mx-auto mb-4" style="width: 80px; height: 80px; font-size: 2.5rem;">
                    <i class="bi bi-compass"></i>
                </div>
                <h1 class="display-4 fw-bold text-primary mb-2">404</h1>
                <h3 class="fw-bold mb-3">Page Not Found</h3>
                <p class="text-muted mb-4">
                    The healthcare page, appointment file, or medical resource you are searching for might have been moved, renamed, or is temporarily unavailable.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('main.home') }}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house-door-fill me-1"></i> Return Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
                        <i class="bi bi-arrow-left me-1"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
