{% extends 'base.html' %}
{% block title %}Change Password — Patient Tracker{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="stat-icon primary mx-auto mb-3" style="width: 58px; height: 58px; font-size: 1.6rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Security & Password</h3>
                        <p class="text-muted small">Update your account credentials to keep your profile secure.</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <div class="input-group password-field-wrapper">
                                <span class="input-group-text"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" name="current_password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <div class="input-group password-field-wrapper">
                                <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="new_password" class="form-control" placeholder="At least 6 characters" required minlength="6">
                            </div>
                            <small class="text-muted" style="font-size: 0.78rem;">Must be at least 6 characters in length.</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm New Password</label>
                            <div class="input-group password-field-wrapper">
                                <span class="input-group-text"><i class="bi bi-shield-check text-muted"></i></span>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Re-type new password" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-check-lg"></i> Update Password
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2">
                        <a href="javascript:history.back()" class="text-muted small text-decoration-none">
                            <i class="bi bi-arrow-left"></i> Cancel and return
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
